<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reports · FoundIt</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ==== Shared site header (extract to templates/_header.html when moving to Flask/Jinja) ==== -->
<header class="site-header">
  <div class="container site-header__bar">
    <a href="home.html" class="brand">
      <span class="brand__icon" id="brand-icon"></span>
      <span class="brand__name">FoundIt</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="home.html" data-page="home">Home</a>
      <a href="my-reports.html" data-page="my-reports">My Reports</a>
    </nav>
    <div class="header-actions">
      <div class="user-chip">
        <span class="user-chip__avatar" data-user-initial></span>
        <span data-user-name></span>
      </div>
      <button class="btn btn-ghost" data-logout title="Log out" aria-label="Log out"><span id="logout-icon"></span></button>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle menu"><span id="menu-icon"></span></button>
    </div>
  </div>
</header>
<!-- ==== /Shared site header ==== -->

<main class="page-main">
  <div class="container">

    <div class="page-head">
      <h1>My Reports</h1>
      <p>Track the status of everything you've reported lost or found.</p>
    </div>

    <div class="form-banner form-banner--success" data-submitted-banner></div>

    <div class="tab-row" role="tablist">
      <button type="button" class="is-active" data-tab="all" role="tab" aria-selected="true">All</button>
      <button type="button" data-tab="lost" role="tab" aria-selected="false">Lost</button>
      <button type="button" data-tab="found" role="tab" aria-selected="false">Found</button>
    </div>

    <div class="report-list" data-report-list>
      <!-- Report rows are rendered here by js/app.js on load -->
    </div>

    <div class="empty-state" data-empty-state style="display:none;">
      <span id="empty-icon"></span>
      <h3>No reports here yet</h3>
      <p>When you report a lost or found item, it'll show up in this list.</p>
    </div>

  </div>
</main>

<!-- ==== Shared site footer (extract to templates/_footer.html when moving to Flask/Jinja) ==== -->
<footer class="site-footer">
  <div class="container">
    <span>© 2026 FoundIt · American University of Phnom Penh</span>
    <span>Need help? Contact <a href="mailto:studentaffairs@aupp.edu.kh">Student Affairs</a></span>
  </div>
</footer>
<!-- ==== /Shared site footer ==== -->

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  const currentUser = requireAuth();

  function reportRowHtml(report) {
    const typeLabel = report.kind === 'lost' ? 'Lost' : 'Found';
    const typeClass = report.kind === 'lost' ? 'type-tag--lost' : 'type-tag--found';
    const thumb = report.photo
      ? `<img src="${report.photo}" alt="">`
      : ICONS.item;
    const linkHref = report.status === 'potential_match'
      ? `potential-match.html?id=${matchIdForReport(report.id) || ''}`
      : null;

    const row = `
      <div class="report-row">
        <div class="report-row__thumb">${thumb}</div>
        <div class="report-row__body">
          <div class="report-row__title">
            <span class="type-tag ${typeClass}">${typeLabel}</span>
            <span>${escapeHtml(report.itemName)}</span>
          </div>
          <div class="report-row__meta">
            <span>${ICONS.pin}${escapeHtml(report.location)}</span>
            <span>${ICONS.clock}${formatDate(report.dateTime)}</span>
          </div>
        </div>
        <div class="report-row__status">
          ${linkHref
            ? `<a href="${linkHref}" class="btn btn-secondary" style="padding:8px 14px; font-size:0.85rem;">Review match</a>`
            : statusPillHtml(report.status)}
        </div>
      </div>`;
    return row;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // Demo-data helper: map a report needing review back to its match id.
  // A real backend would include `match_id` directly on the report object.
  function matchIdForReport(reportId) {
    const map = { report_lost_1: 'match_demo_1', report_found_match: 'match_demo_1' };
    return map[reportId];
  }

  let allReports = { lost: [], found: [] };
  let activeTab = 'all';

  function render() {
    const list = document.querySelector('[data-report-list]');
    const empty = document.querySelector('[data-empty-state]');
    let items = [];
    if (activeTab === 'all') items = [...allReports.lost, ...allReports.found];
    else if (activeTab === 'lost') items = allReports.lost;
    else items = allReports.found;

    items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    if (!items.length) {
      list.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      list.innerHTML = items.map(reportRowHtml).join('');
    }
  }

  if (currentUser) {
    document.getElementById('brand-icon').innerHTML = ICONS.logo;
    document.getElementById('logout-icon').innerHTML = ICONS.logout;
    document.getElementById('menu-icon').innerHTML = ICONS.menu;
    document.getElementById('empty-icon').innerHTML = ICONS.inbox;
    initHeader('my-reports');

    const params = new URLSearchParams(window.location.search);
    const submitted = params.get('submitted');
    if (submitted) {
      const banner = document.querySelector('[data-submitted-banner]');
      banner.textContent = submitted === 'lost'
        ? "Your lost item report has been submitted. We'll email you if there's a match."
        : 'Thanks for reporting a found item — we\'ll try to track down the owner.';
      banner.classList.add('is-visible');
    }

    document.querySelectorAll('.tab-row button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-row button').forEach((b) => {
          b.classList.remove('is-active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('is-active');
        btn.setAttribute('aria-selected', 'true');
        activeTab = btn.dataset.tab;
        render();
      });
    });

    api.getMyReports().then((data) => {
      allReports = data;
      render();
    });
  }
</script>
</body>
</html>
